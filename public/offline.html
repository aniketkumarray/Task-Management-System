<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline · Task Tracker</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f7f9; color: #111827; }
      .box { text-align: center; padding: 32px; max-width: 320px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 18px; margin: 16px 0 6px; }
      p { font-size: 14px; color: #6b7280; margin: 0 0 20px; }
      @media (prefers-color-scheme: dark) { body { background: #0d1117; color: #eef1f5; } p { color: #8e97a5; } }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Task Tracker needs a connection to load your tasks. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
