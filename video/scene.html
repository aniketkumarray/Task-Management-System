<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Task Tracker — demo video scene</title>
<style>
  @font-face { font-family: "Geist"; src: url("node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "GeistMono"; src: url("node_modules/geist/dist/fonts/geist-mono/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }

  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #070a12;
    font-family: "Geist", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
  }
  #stage * { box-sizing: border-box; }

  /* ---------- background ---------- */
  .blob { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; left: -700px; top: -700px; will-change: transform, opacity; }
  .blob.b1 { background: radial-gradient(circle, rgba(37,99,235,.55) 0%, rgba(37,99,235,.18) 32%, rgba(37,99,235,0) 65%); }
  .blob.b2 { background: radial-gradient(circle, rgba(124,58,237,.45) 0%, rgba(124,58,237,.14) 32%, rgba(124,58,237,0) 65%); }
  .blob.b3 { background: radial-gradient(circle, rgba(6,182,212,.35) 0%, rgba(6,182,212,.10) 32%, rgba(6,182,212,0) 65%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 96px 96px; background-position: 48px 0;
    -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 20%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 65% at 50% 45%, #000 20%, transparent 100%);
  }
  .noise { position: absolute; inset: 0; opacity: .075; mix-blend-mode: soft-light; background-repeat: repeat; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 50%, rgba(0,0,0,.6) 100%); }
  .flash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #fff 0%, rgba(255,255,255,.4) 40%, transparent 75%); opacity: 0; }

  /* ---------- scenes ---------- */
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; will-change: transform, opacity; perspective: 2000px; }

  .kicker { position: absolute; font-size: 20px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #93a4ff; display: flex; align-items: center; gap: 12px; }
  .kicker::before { content: ""; width: 28px; height: 2px; background: linear-gradient(90deg, #2563eb, #7c3aed); border-radius: 2px; }
  .h1 { position: absolute; font-size: 64px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08; color: #fff; }
  .h1 .w, .sub .w, .tag .w { display: inline-block; will-change: transform, opacity, filter; }
  .accent { background: linear-gradient(92deg, #7dd3fc 0%, #818cf8 55%, #c084fc 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; font-size: 28px; font-weight: 400; color: rgba(255,255,255,.66); line-height: 1.4; letter-spacing: -.01em; }

  /* browser window */
  .cam { position: absolute; transform-origin: 0 0; will-change: transform; }
  .browser {
    position: relative; border-radius: 18px; background: #0f1320; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 50px 140px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4), 0 0 120px rgba(37,99,235,.10);
    overflow: hidden; transform-style: preserve-3d; will-change: transform, opacity;
  }
  .browser .bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: linear-gradient(#171c2b, #121626); border-bottom: 1px solid rgba(255,255,255,.08); }
  .browser .dot { width: 12px; height: 12px; border-radius: 50%; }
  .browser .dot.r { background: #ff5f57; } .browser .dot.y { background: #febc2e; } .browser .dot.g { background: #28c840; }
  .browser .url { margin-left: 18px; height: 26px; min-width: 420px; padding: 0 14px; border-radius: 8px; background: rgba(255,255,255,.07); color: rgba(255,255,255,.6); font: 500 13px/26px "GeistMono", monospace; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
  .browser .url::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #28c840; }
  .browser .view { position: relative; overflow: hidden; background: #f6f7f9; }
  .browser .view img { display: block; width: 100%; height: auto; }

  /* callouts */
  .co { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; will-change: opacity; }
  .co .ring { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--c, #60a5fa); box-shadow: 0 0 0 6px rgba(96,165,250,.18), 0 0 24px rgba(96,165,250,.5); will-change: transform, opacity; }
  .co .ring::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--c, #60a5fa); }
  .co .line { position: absolute; left: 0; top: -1px; height: 2px; background: linear-gradient(90deg, var(--c, #60a5fa), rgba(96,165,250,.2)); transform-origin: 0 50%; will-change: transform, opacity; }
  .co .pill {
    position: absolute; white-space: nowrap; padding: 0 18px; height: 46px; border-radius: 999px; font-size: 22px; font-weight: 500; letter-spacing: -.01em;
    background: rgba(13,17,30,.86); border: 1px solid rgba(255,255,255,.22); color: #fff; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,.45); backdrop-filter: blur(10px); will-change: transform, opacity;
  }
  .co .pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, #60a5fa); box-shadow: 0 0 12px var(--c, #60a5fa); }

  /* spotlight (update scene) */
  .spot { position: absolute; border-radius: 12px; border: 2px solid rgba(125,211,252,.95); box-shadow: 0 0 0 4000px rgba(7,10,18,.62), 0 0 30px rgba(125,211,252,.45); will-change: left, top, width, height, opacity; pointer-events: none; }
  .spot-label { position: absolute; white-space: nowrap; padding: 0 20px; height: 52px; border-radius: 999px; font-size: 26px; font-weight: 500; background: rgba(13,17,30,.9); border: 1px solid rgba(255,255,255,.22); display: flex; align-items: center; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.45); will-change: transform, opacity; }
  .spot-label .num { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #7c3aed); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  /* flat card (close-up image) */
  .cardimg { position: absolute; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 50px 140px rgba(0,0,0,.65), 0 0 90px rgba(37,99,235,.12); will-change: transform, opacity; }
  .cardimg img { display: block; width: 100%; height: auto; }

  /* phone */
  .phone { position: absolute; border-radius: 58px; background: #0b0c12; padding: 14px; box-shadow: 0 60px 140px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.10), 0 0 0 1px rgba(0,0,0,.6); will-change: transform, opacity; transform-style: preserve-3d; }
  .phone .screen { position: relative; border-radius: 46px; overflow: hidden; background: #fff; padding-top: 58px; }
  .phone .screen img { display: block; width: 100%; height: auto; }
  .phone .status { position: absolute; left: 0; top: 0; width: 100%; height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; color: #111; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .phone .status .sig { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .phone .status .sig i { display: block; width: 4px; background: #111; border-radius: 1px; }
  .phone .status .bat { width: 27px; height: 13px; border: 1.5px solid #111; border-radius: 4px; padding: 1.5px; margin-left: 6px; }
  .phone .status .bat i { display: block; width: 100%; height: 100%; background: #111; border-radius: 2px; }
  .phone .island { position: absolute; left: 50%; top: 26px; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #0b0c12; }
  .phone .reflect { position: absolute; inset: 14px; border-radius: 46px; background: linear-gradient(115deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 28%); pointer-events: none; }

  /* logo */
  .logo { position: absolute; width: 168px; height: 168px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 80px rgba(37,99,235,.45), 0 0 0 1px rgba(255,255,255,.12); will-change: transform, opacity; }
  .logo img { display: block; width: 100%; height: 100%; }
  .shock { position: absolute; border-radius: 50%; border: 2px solid rgba(147,197,253,.8); will-change: transform, opacity; }
  .wordmark { position: absolute; font-size: 96px; font-weight: 600; letter-spacing: -.045em; white-space: nowrap; will-change: transform, opacity, clip-path; }
  .tag { position: absolute; font-size: 40px; font-weight: 500; letter-spacing: -.02em; color: rgba(255,255,255,.9); white-space: nowrap; }
  .sweep { position: absolute; width: 180px; height: 500px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); transform: rotate(18deg); mix-blend-mode: overlay; will-change: transform, opacity; }
  .urlpill { position: absolute; height: 58px; padding: 0 26px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); font: 500 24px/58px "GeistMono", monospace; color: rgba(255,255,255,.85); will-change: transform, opacity; }

  .bigword { position: absolute; left: 200px; font-size: 150px; font-weight: 600; letter-spacing: -.045em; line-height: 1; white-space: nowrap; will-change: transform, opacity, filter; }
  .chip { position: absolute; height: 54px; padding: 0 22px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); font-size: 24px; font-weight: 500; display: flex; align-items: center; gap: 12px; will-change: transform, opacity; }
  .chip .ico { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #7dd3fc, #818cf8); }
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1" id="b1"></div>
  <div class="blob b2" id="b2"></div>
  <div class="blob b3" id="b3"></div>
  <div class="grid"></div>
  <div class="noise" id="noise"></div>
  <div id="scenes"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
</div>

<script>
// ------------------------------------------------------------------ utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const prog = (t, start, dur) => clamp((t - start) / dur);
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inCubic: x => x * x * x,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.exp(-5.5 * x) * Math.cos(9 * x) * (1 - x),
};
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const px = v => `${v}px`;
const stage = document.getElementById("stage");
const scenesRoot = document.getElementById("scenes");

let TL = null, SC = {}, W = {};
// word time: first occurrence (or nth) of a word in a scene's VO, matched loosely
function wt(scene, word, nth = 0) {
  const norm = s => s.toLowerCase().replace(/[^a-z0-9']/g, "");
  const list = SC[scene].words.filter(w => norm(w.w) === norm(word));
  if (!list[nth]) { console.warn("word not found", scene, word); return SC[scene].vo_start; }
  return list[nth].t;
}
// word-by-word reveal; times[] absolute; returns nothing
function wordsReveal(spans, times, t, dur = .42, dy = 22) {
  spans.forEach((s, i) => {
    const p = E.outCubic(prog(t, times[i], dur));
    s.style.opacity = p;
    s.style.transform = `translateY(${(1 - p) * dy}px)`;
    s.style.filter = p < 1 ? `blur(${(1 - p) * 6}px)` : "none";
  });
}
function splitWords(container, text) {
  container.innerHTML = "";
  const spans = [];
  text.split(/(\s+|\n)/).forEach(tok => {
    if (tok === "\n") { container.appendChild(document.createElement("br")); return; }
    if (/^\s+$/.test(tok)) { container.appendChild(document.createTextNode(" ")); return; }
    if (!tok) return;
    const accent = tok.startsWith("*") && tok.endsWith("*");
    const s = el("span", "w" + (accent ? " accent" : ""), container, accent ? tok.slice(1, -1) : tok);
    s.style.opacity = 0; spans.push(s);
  });
  return spans;
}
// staggered times starting at t0
const stagger = (n, t0, step = .07) => Array.from({ length: n }, (_, i) => t0 + i * step);

// noise tile
(() => {
  const c = document.createElement("canvas"); c.width = c.height = 256; const ctx = c.getContext("2d");
  const img = ctx.createImageData(256, 256); let seed = 12345;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (rnd() - .5) * 200; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0); document.getElementById("noise").style.backgroundImage = `url(${c.toDataURL()})`;
})();

// ------------------------------------------------------------------ components
function browserWindow(parent, { src, width, left, top, url, imgW, imgH, offsetX = 0 }) {
  const cam = el("div", "cam", parent); cam.style.left = px(left); cam.style.top = px(top);
  // .cam (camera) > .inner (enter animation) > .browser (clips) + .overlay (callouts, never clipped)
  const inner = el("div", null, cam); inner.style.position = "relative"; inner.style.width = px(width); inner.style.transformOrigin = "50% 60%"; inner.style.willChange = "transform, opacity";
  const b = el("div", "browser", inner); b.style.width = px(width);
  el("div", "bar", b, `<span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><div class="url">${url}</div>`);
  const view = el("div", "view", b);
  const img = el("img", null, view); img.src = src;
  const dispH = imgH * (width / imgW);
  view.style.height = px(dispH);
  const overlay = el("div", null, inner); overlay.style.position = "absolute"; overlay.style.left = "0"; overlay.style.top = "0"; overlay.style.width = px(width); overlay.style.height = px(44 + dispH); overlay.style.pointerEvents = "none";
  const scale = width / imgW;              // screenshot px -> local px
  // Anchor coordinates were measured on 2000px-wide previews of the screenshots.
  const V = imgW / 2000;
  const local = (sx, sy) => ({ x: sx * V * scale, y: 44 + sy * V * scale });
  return { cam, b: inner, browser: b, el: overlay, view, img, width, height: 44 + dispH, left, top, offsetX, local, callouts: [] };
}
// callout anchored at local point (x,y) of a window/card; side: right|left|top|bottom
// align (top/bottom only): center | start (pill hangs to the right of the ring) | end (to the left)
function callout(win, { x, y, label, side = "right", len = 150, color = "#60a5fa", at, dur = .55, align = "center" }) {
  const parent = win.el;
  const c = el("div", "co", parent); c.style.left = px(x); c.style.top = px(y); c.style.setProperty("--c", color);
  const ring = el("div", "ring", c);
  const line = el("div", "line", c);
  const pill = el("div", "pill", c, label);
  const ang = { right: 0, left: 180, top: -90, bottom: 90 }[side];
  line.style.width = px(len); line.style.transform = `rotate(${ang}deg) scaleX(0)`;
  // pill position at the end of the line
  const ex = Math.cos(ang * Math.PI / 180) * len, ey = Math.sin(ang * Math.PI / 180) * len;
  pill.style.left = px(ex); pill.style.top = px(ey - 23);
  let base = "";
  if (side === "left") base = "translateX(-100%)";
  if (side === "top" || side === "bottom") base = align === "start" ? "translateX(-24px)" : align === "end" ? "translateX(calc(-100% + 24px))" : "translateX(-50%)";
  pill.style.transform = base;
  const co = { el: c, ring, line, pill, at, dur, side, ang, base };
  win.callouts.push(co);
  return co;
}
function animCallouts(win, t, camScale = 1) {
  for (const co of win.callouts) {
    const p = prog(t, co.at, co.dur);
    co.el.style.opacity = p > 0 ? 1 : 0;
    co.el.style.transform = `scale(${1 / camScale})`;   // constant on-screen size under camera zoom
    const r = E.outBack(clamp(p * 1.6));
    co.ring.style.transform = `scale(${r})`; co.ring.style.opacity = clamp(p * 3);
    const l = E.outCubic(clamp((p - .2) / .5));
    co.line.style.transform = `rotate(${co.ang}deg) scaleX(${l})`;
    const q = E.outBack(clamp((p - .45) / .55));
    co.pill.style.opacity = clamp((p - .45) / .3);
    co.pill.style.transform = `${co.base} scale(${.85 + .15 * q})`;
    // soft idle pulse on the ring
    if (p >= 1) co.ring.style.boxShadow = `0 0 0 ${6 + 4 * Math.sin((t - co.at) * 4)}px rgba(96,165,250,.18), 0 0 24px rgba(96,165,250,.5)`;
  }
}
// camera: shots [{t, dur, s, P:{x,y} local, Q:{x,y} stage}] ; identity shot = {s:1, P:{0,0}, Q:{left,top}}
function camera(win, shots, t) {
  // Q is in stage coordinates; win.offsetX compensates for a translated parent track.
  const ident = { s: 1, P: { x: 0, y: 0 }, Q: { x: win.left - win.offsetX, y: win.top } };
  let a = ident, b = ident, p = 1;
  for (const sh of shots) {
    if (t >= sh.t) { a = b; b = sh; p = E.inOutCubic(prog(t, sh.t, sh.dur || 1.1)); }
  }
  const s = lerp(a.s, b.s, p);
  const txA = a.Q.x + win.offsetX - win.left - a.s * a.P.x, tyA = a.Q.y - win.top - a.s * a.P.y;
  const txB = b.Q.x + win.offsetX - win.left - b.s * b.P.x, tyB = b.Q.y - win.top - b.s * b.P.y;
  return { tx: lerp(txA, txB, p), ty: lerp(tyA, tyB, p), s };
}
// fade the headline while the camera is zoomed in
function headerZoomFade(hd, s) {
  const o = 1 - clamp((s - 1.05) / .2);
  hd.k.style.opacity = Math.min(parseFloat(hd.k.style.opacity || 1), o);
  hd.h.style.opacity = o;
}
function header(parent, kicker, h1Text, { left = 120, top = 118 } = {}) {
  const k = el("div", "kicker", parent, kicker); k.style.left = px(left); k.style.top = px(top);
  const h = el("div", "h1", parent); h.style.left = px(left); h.style.top = px(top + 48); h.style.maxWidth = "1500px";
  const spans = splitWords(h, h1Text);
  return { k, h, spans };
}
function animHeader(hd, t, t0) {
  const p = E.outCubic(prog(t, t0, .5));
  hd.k.style.opacity = p; hd.k.style.transform = `translateY(${(1 - p) * 14}px)`;
  wordsReveal(hd.spans, stagger(hd.spans.length, t0 + .12, .06), t, .5, 26);
}
function sceneFade(node, t, s, { inDur = .5, outDur = .4, scaleIn = .985, scaleOut = 1.02 } = {}) {
  const pin = E.outCubic(prog(t, s.start, inDur));
  const pout = E.inCubic(prog(t, s.end - outDur, outDur));
  const vis = t >= s.start - .001 && t < s.end + .001;
  node.style.visibility = vis ? "visible" : "hidden";
  node.style.opacity = vis ? pin * (1 - pout) : 0;
  const sc = lerp(scaleIn, 1, pin) * lerp(1, scaleOut, pout);
  node.style.transform = `scale(${sc})`;
}
const windowEnter = (win, t, t0, { dur = 1.0, dy = 160, rx = 7 } = {}) => {
  const p = E.outQuint(prog(t, t0, dur));
  return { p, transform: `translateY(${(1 - p) * dy}px) scale(${lerp(.94, 1, p)}) rotateX(${(1 - p) * rx}deg)`, opacity: p };
};

// ------------------------------------------------------------------ scenes
const SCENES = [];
const SHOT = {
  today: { src: "shots/desk-today.png", w: 2880, h: 1800 },
  todayFull: { src: "shots/desk-today-full.png", w: 2880, h: 2298 },
  quick: { src: "shots/desk-quick-update.png", w: 2208, h: 566 },
  ticketFull: { src: "shots/desk-ticket-full.png", w: 2880, h: 2084 },
  month: { src: "shots/desk-calendar-month.png", w: 2880, h: 1800 },
  timeline: { src: "shots/desk-calendar-timeline.png", w: 2880, h: 1800 },
  team: { src: "shots/desk-team.png", w: 2880, h: 1800 },
  settings: { src: "shots/desk-settings-expanded.png", w: 2880, h: 1800 },
  settingsTeam: { src: "shots/desk-settings-team.png", w: 2880, h: 1800 },
  phoneToday: { src: "shots/phone-today.png", w: 1170, h: 2532 },
  phoneTimeline: { src: "shots/phone-timeline.png", w: 1170, h: 2532 },
  logo: "../public/icons/icon-512.png",
};

function buildScenes() {
  // ---------------------------------------------------------------- HOOK
  {
    const s = SC.hook; const node = el("div", "scene", scenesRoot);
    const words = ["Dashboards.", "Reports.", "Deadlines."].map((w, i) => { const e = el("div", "bigword", node, w); e.style.top = px(300 + i * 160); e.style.opacity = 0; return e; });
    const times = [wt("hook", "Dashboards"), wt("hook", "Reports"), wt("hook", "Deadlines")];
    const tOut = wt("hook", "When");

    const s = SC.close; const node = el("div", "scene", scenesRoot);
    const logo = el("div", "logo", node, `<img src="${SHOT.logo}">`); logo.style.width = logo.style.height = px(140); logo.style.borderRadius = px(34);
    const wm = el("div", "wordmark", node, "Task Tracker"); wm.style.fontSize = px(84);
    const tag = el("div", "tag", node); tag.style.left = "0"; tag.style.width = "1920px"; tag.style.textAlign = "center"; tag.style.top = px(600); tag.style.fontSize = px(56); tag.style.fontWeight = "600"; tag.style.letterSpacing = "-.03em";
    const sp = splitWords(tag, "One update a day. *Nothing* *slips.*");
    const wtimes = ["One", "update", "a", "day", "Nothing", "slips"].map(w => wt("close", w));
    const url = el("div", "urlpill", node, "tms-xi-one.vercel.app"); url.style.left = "0"; url.style.top = px(720); url.style.opacity = 0;
    url.style.position = "absolute"; url.style.left = "50%"; url.style.transform = "translateX(-50%)";
    let wmW = 700;
    SCENES.push({ s, node, measure() { wmW = wm.getBoundingClientRect().width || 700; }, frame(t) {
      sceneFade(node, t, s, { inDur: .35, outDur: 1.3, scaleOut: 1 });
      const total = 140 + 36 + wmW; const x0 = 960 - total / 2;
      logo.style.left = px(x0); logo.style.top = px(400 - 70);
      wm.style.left = px(x0 + 140 + 36); wm.style.top = px(400 - 50);
      const pop = E.spring(prog(t, s.start, .9));
      logo.style.transform = `scale(${pop})`; logo.style.opacity = clamp(pop * 2);
      const pw = E.outQuint(prog(t, s.start + .15, .8));
      wm.style.opacity = pw; wm.style.transform = `translateX(${(1 - pw) * -30}px)`;
      wordsReveal(sp, wtimes, t, .45, 26);
      const pu = E.outCubic(prog(t, wt("close", "slips") + .9, .6));
      url.style.opacity = pu; url.style.transform = `translateX(-50%) translateY(${(1 - pu) * 16}px)`;
    } });
  }
}

// ------------------------------------------------------------------ background + master frame
const blobs = [document.getElementById("b1"), document.getElementById("b2"), document.getElementById("b3")];
const flash = document.getElementById("flash");
function background(t) {
  const k = t * .09;
  const pos = [
    [520 + Math.sin(k * .9) * 260, 300 + Math.cos(k * .7) * 180],
    [1500 + Math.cos(k * .8 + 1) * 280, 520 + Math.sin(k * .6 + 2) * 220],
    [1000 + Math.sin(k * .5 + 3) * 420, 1150 + Math.cos(k * .4) * 120],
  ];
  const hookBoost = t < SC.reveal.start ? .55 : 1;
  const revealBoost = 1 + .5 * Math.exp(-Math.max(0, t - SC.reveal.start) * .8) * (t >= SC.reveal.start ? 1 : 0);
  blobs.forEach((b, i) => { b.style.transform = `translate(${pos[i][0]}px, ${pos[i][1]}px)`; b.style.opacity = clamp(hookBoost * revealBoost * [1, .9, .8][i]); });
  // flashes on hits
  const hits = [[SC.reveal.start, .5], ...["myday", "update", "history", "calendar", "team", "config", "mobile", "close"].map(id => [SC[id].start, .22])];
  let f = 0; for (const [h, a] of hits) if (t >= h) f = Math.max(f, a * Math.exp(-(t - h) * 7));
  flash.style.opacity = f;
}
window.frame = function (t) {
  background(t);
  for (const sc of SCENES) {
    const active = t >= sc.s.start - .05 && t <= sc.s.end + .05;
    if (!active) { sc.node.style.visibility = "hidden"; sc.node.style.opacity = 0; continue; }
    sc.frame(t);
  }
};
window.init = async function (tl) {
  TL = tl; tl.scenes.forEach(s => (SC[s.id] = s));
  buildScenes();
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; })));
  // measure text widths with everything visible once
  for (const sc of SCENES) { sc.node.style.visibility = "visible"; sc.node.style.opacity = 1; }
  for (const sc of SCENES) sc.measure && sc.measure();
  window.frame(0);
  return { duration: tl.duration, scenes: tl.scenes.length };
};
</script>
